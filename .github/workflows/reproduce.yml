name: Validate and reproduce Wi-Fi course simulation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real SimPy and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests on real SimPy
        run: python -m unittest discover -s tests -v
      - name: Run full A-class experiment matrix
        run: python -m wifi_sim.experiments --out results --duration 10 --seeds 42 43 44 --bianchi-step 5
      - name: Audit final configuration and frame accounting
        run: python -m wifi_sim.acceptance results --write-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifi-a-class-results
          path: results/
          if-no-files-found: warn
