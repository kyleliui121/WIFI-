name: Validate and reproduce Wi-Fi course simulation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real SimPy and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests on real SimPy
        run: python -m unittest discover -s tests -v
      - name: Run full A-class experiment matrix
        run: python -m wifi_sim.experiments --out results --duration 10 --seeds 42 43 44 --bianchi-step 5
      - name: Audit final configuration and frame accounting
        run: python -m wifi_sim.acceptance results --write-report
      - name: Validate both extensions with a matched short baseline
        run: |
          python -m wifi_sim.extensions --out results/extensions-smoke --duration 1 --seeds 42 --rates 0.05
          python -m tools.analyze_extensions --results results/extensions-smoke
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("results/extensions-smoke")
          info = json.loads((folder / "ext_metadata.json").read_text(encoding="utf-8"))
          assert [info[f"runs_{name}"] for name in ("baseline", "frame_error", "hidden")] == [12, 12, 12]
          for no in range(7, 11):
              for suffix in ("pdf", "png"):
                  paths = list(folder.glob(f"{no:02}_ext_*.{suffix}"))
                  assert len(paths) == 1 and paths[0].stat().st_size > 2000
          PY
      - name: Smoke-test the four-AC matrix and summary
        run: |
          python -m wifi_sim.ext34 --out results/ext34-smoke --duration 0.5 --seeds 71 --n 10
          python -m tools.analyze_ext34 --results results/ext34-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifi-a-class-results
          path: results/
          if-no-files-found: warn
